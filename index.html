<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Amigo Secreto da Semana</title>
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<main class="cartao" id="cartao">
  <p class="rotulo">Carregando…</p>
</main>

<script src="assets/dados.js"></script>
<script src="assets/sorteio.js"></script>
<script>
const cartao = document.getElementById("cartao");
const token = new URLSearchParams(location.search).get("t") || "";
const encontrado = buscarPorToken(token);

if (!encontrado) {
  cartao.innerHTML =
    '<h1>Link inválido</h1>' +
    '<p class="aviso erro">Esse link não corresponde a nenhum participante. ' +
    'Confira se você copiou o endereço inteiro.</p>';
} else {
  const semana = numeroDaSemana();
  const pares = sorteioDoGrupo(encontrado.pessoas, semana);
  const sorteado = pares[encontrado.indice].para.nome;
  const virada = formatarData(proximaSegunda());

  cartao.innerHTML =
    '<h1>Olá, ' + encontrado.pessoa.nome + '!</h1>' +
    '<p class="semana">Sorteio desta semana</p>' +
    '<p class="rotulo">Você tirou</p>' +
    '<p class="sorteado">' + sorteado + '</p>' +
    '<p class="aviso">Guarde segredo! O próximo sorteio começa na segunda-feira, ' +
    virada + '.</p>';
}
</script>
</body>
</html>
