<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuidar Uns dos Outros | Ministério de Louvor</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
<img class="marca" src="assets/logo.png" alt="Paz Church Embu-Guaçu">

<main class="cartao" id="cartao">
  <p class="subtitulo">Carregando…</p>
</main>

<p class="rodape">Ministério de Louvor · Paz Church Embu-Guaçu</p>

<script src="assets/dados.js"></script>
<script src="assets/sorteio.js"></script>
<script>
const cartao = document.getElementById("cartao");
const token = new URLSearchParams(location.search).get("t") || "";
const encontrado = buscarPorToken(token);

const versiculo =
  '<blockquote class="versiculo">' +
  '“Para que não haja divisão no corpo, mas, antes, tenham os membros igual cuidado uns ' +
  'pelos outros. De maneira que, se um membro padece, todos os membros padecem com ele; ' +
  'e, se um membro é honrado, todos os membros se regozijam com ele.”' +
  '<cite>1 Coríntios 12:25-26</cite></blockquote>';

if (!encontrado) {
  cartao.innerHTML =
    '<span class="selo">Cuidar uns dos outros</span>' +
    '<h1>Link inválido</h1>' +
    '<p class="subtitulo erro">Este link não corresponde a nenhum integrante do ministério. ' +
    'Confira se o endereço foi copiado por inteiro.</p>' +
    versiculo;
} else {
  const semana = numeroDaSemana();
  const pares = sorteioDoGrupo(encontrado.pessoas, semana);
  const sorteado = pares[encontrado.indice].para.nome;
  const virada = formatarData(proximaSegunda());
  // O pronome acompanha o grupo: mulheres tiram mulheres, homens tiram homens.
  const pron = encontrado.grupo === "mulheres" ? "ela" : "ele";

  cartao.innerHTML =
    '<span class="selo">Cuidar uns dos outros</span>' +
    '<h1>Olá, ' + encontrado.pessoa.nome + '!</h1>' +
    '<p class="subtitulo">Esta é a pessoa que você vai cuidar de forma especial nesta semana.</p>' +
    '<div class="revelacao">' +
      '<p class="rotulo">Você tirou</p>' +
      '<p class="sorteado" id="sorteado">&nbsp;</p>' +
    '</div>' +
    versiculo +
    '<ul class="cuidados">' +
      '<li><span class="icone">🙏</span><span>Ore por ' + pron + ' com mais intensidade durante a semana.</span></li>' +
      '<li><span class="icone">💬</span><span>Mande uma mensagem e pergunte como ' + pron + ' está.</span></li>' +
      '<li><span class="icone">❤️</span><span>Pergunte se ' + pron + ' precisa de algo ou tem algum pedido de oração.</span></li>' +
    '</ul>' +
    '<p class="aviso">Mais do que ministrarmos juntos, queremos cuidar uns dos outros como corpo ' +
    'de Cristo. 🫶<br>O próximo sorteio começa na segunda-feira, ' + virada + '.</p>';

  // Na primeira visita da semana o nome passa numa "roleta" antes de parar no sorteado.
  const chave = "revelado:" + token + ":" + semana;
  let jaViu = false;
  try {
    jaViu = localStorage.getItem(chave) === "1";
  } catch (e) {
    jaViu = true; // sem localStorage (navegação privada), mostra direto
  }

  const alvo = document.getElementById("sorteado");

  if (jaViu) {
    alvo.textContent = sorteado;
    alvo.classList.add("parou");
  } else {
    girarRoleta(alvo, encontrado.pessoas, encontrado.pessoa.nome, sorteado, () => {
      try { localStorage.setItem(chave, "1"); } catch (e) {}
    });
  }
}

// Sorteia nomes do grupo em sequência, desacelerando até parar no nome certo.
function girarRoleta(alvo, pessoas, proprioNome, sorteado, aoTerminar) {
  const candidatos = pessoas
    .map((p) => p.nome)
    .filter((nome) => nome !== proprioNome && nome !== sorteado);

  alvo.classList.add("girando");

  const passos = [];
  for (let i = 0; i < 26; i++) {
    passos.push(candidatos[i % candidatos.length]);
  }
  // Embaralha para a sequência não parecer uma lista em ordem.
  for (let i = passos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [passos[i], passos[j]] = [passos[j], passos[i]];
  }
  passos.push(sorteado);

  let i = 0;
  function proximo() {
    alvo.textContent = passos[i];
    const ultimo = i === passos.length - 1;
    if (ultimo) {
      alvo.classList.remove("girando");
      alvo.classList.add("parou");
      if (aoTerminar) aoTerminar();
      return;
    }
    // Intervalo cresce de ~55ms até ~340ms: efeito de roleta perdendo força.
    const progresso = i / (passos.length - 1);
    i++;
    setTimeout(proximo, 55 + Math.pow(progresso, 3) * 285);
  }
  proximo();
}
</script>
</body>
</html>
